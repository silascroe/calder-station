<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A window into the Town simulation." />
    <title>Town — Rookwood</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/map.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" data-route aria-label="Rookwood town view">
          <span class="brand-mark">R</span>
          <span><strong>Rookwood</strong><small>Town view</small></span>
        </a>
        <nav class="nav" aria-label="Primary navigation">
          <a href="/" data-route data-nav="/">Town</a>
          <a href="/map" data-route data-nav="/map">Map</a>

      <main id="app" aria-live="polite"></main>

      <footer class="footer">
        <span>ROOKWOOD / PERSISTENT TOWN</span>
