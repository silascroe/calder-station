<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Stylized plan of Rookwood">
  <defs>
    <pattern id="paper" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M0 35.5H36M35.5 0V36" stroke="#27342d" stroke-width="1" opacity=".24"/>
    </pattern>
    <pattern id="fields" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M0 9H18" stroke="#71805f" stroke-width="2" opacity=".13"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#111a15"/>
  <rect width="1200" height="720" fill="url(#paper)"/>

  <!-- broad land uses: enough context to read the town without hard-coding buildings -->
  <path d="M0 430C120 390 260 402 355 472C421 521 420 627 369 720H0Z" fill="#536044" opacity=".18"/>
  <path d="M0 430C120 390 260 402 355 472C421 521 420 627 369 720H0Z" fill="url(#fields)"/>
  <path d="M618 505C735 474 931 492 1045 548C1125 588 1183 650 1200 720H596C578 635 575 551 618 505Z" fill="#69563d" opacity=".14"/>
  <path d="M918 344C1012 317 1121 344 1200 401V612C1120 592 1017 565 931 505C872 464 856 382 918 344Z" fill="#596659" opacity=".15"/>
  <path d="M625 0H952C927 96 889 161 816 196C743 231 659 189 620 118Z" fill="#4c5d4e" opacity=".18"/>
  <path d="M386 171C479 126 645 131 726 207C789 265 770 367 688 411C597 461 455 430 389 353C339 295 335 196 386 171Z" fill="#725b38" opacity=".10"/>
  <path d="M731 112C827 77 1018 89 1096 158C1150 205 1129 292 1054 319C949 357 788 318 724 249C690 212 688 128 731 112Z" fill="#53625a" opacity=".14"/>

  <!-- soft district labels -->
  <g fill="#a3aa9f" opacity=".28" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" letter-spacing="4">
    <text x="74" y="654">FIELDS</text>
    <text x="707" y="658">HOUSES</text>
    <text x="991" y="526">HOUSES</text>
    <text x="674" y="82">HILL HOUSES</text>
    <text x="445" y="238">CIVIC CORE</text>
    <text x="856" y="171">WORKSHOPS</text>
  </g>

  <!-- road shadows -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 452C242 432 414 387 594 314C761 246 944 250 1145 315" stroke="#08100c" stroke-width="22" opacity=".7" filter="url(#soft)"/>
    <path d="M218 704C303 574 407 435 594 314C681 258 735 177 760 24" stroke="#08100c" stroke-width="22" opacity=".7" filter="url(#soft)"/>
    <path d="M102 312C246 324 421 331 594 314C770 297 955 366 1138 520" stroke="#08100c" stroke-width="18" opacity=".55" filter="url(#soft)"/>
  </g>

  <!-- roads -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 452C242 432 414 387 594 314C761 246 944 250 1145 315" stroke="#44534a" stroke-width="14"/>
    <path d="M218 704C303 574 407 435 594 314C681 258 735 177 760 24" stroke="#44534a" stroke-width="14"/>
    <path d="M102 312C246 324 421 331 594 314C770 297 955 366 1138 520" stroke="#3c4b43" stroke-width="10"/>
    <path d="M64 452C242 432 414 387 594 314C761 246 944 250 1145 315" stroke="#899187" stroke-width="1.5" opacity=".28"/>
    <path d="M218 704C303 574 407 435 594 314C681 258 735 177 760 24" stroke="#899187" stroke-width="1.5" opacity=".28"/>
  </g>

  <!-- central square / civic center -->
  <path d="M545 272L624 268L652 325L595 365L526 334Z" fill="#8e744a" opacity=".18" stroke="#b09563" stroke-width="1" stroke-opacity=".25"/>

  <!-- light parcel marks: visual texture, not simulated geography -->
  <g fill="none" stroke="#768178" stroke-width="1" opacity=".12">
    <path d="M670 548L716 518L765 558L731 604Z"/><path d="M780 535L825 509L866 553L837 594Z"/>
    <path d="M952 397L1006 370L1040 412L991 447Z"/><path d="M1052 420L1098 395L1137 439L1092 470Z"/>
    <path d="M650 72L699 48L735 89L694 117Z"/><path d="M797 61L842 45L873 87L828 110Z"/>
    <path d="M824 168L874 143L906 186L860 216Z"/><path d="M954 173L1001 151L1033 194L988 222Z"/>
  </g>

  <g fill="#8c9a8d" opacity=".18">
    <circle cx="86" cy="541" r="4"/><circle cx="112" cy="562" r="3"/><circle cx="140" cy="531" r="5"/><circle cx="182" cy="584" r="4"/>
    <circle cx="1085" cy="591" r="4"/><circle cx="1119" cy="615" r="5"/><circle cx="1145" cy="575" r="3"/>
    <circle cx="604" cy="95" r="4"/><circle cx="577" cy="122" r="3"/><circle cx="1016" cy="104" r="4"/>
  </g>

  <rect x="18" y="18" width="1164" height="684" rx="2" fill="none" stroke="#526059" stroke-width="1" opacity=".26"/>
</svg>