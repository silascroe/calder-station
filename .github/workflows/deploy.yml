name: Deploy Town Dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment to deploy
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: town-deploy-${{ github.event_name == 'push' && 'staging' || inputs.environment }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        run: npm run validate:deploy

      - name: Run tests
        run: npm test

  deploy-staging:
    if: ${{ github.event_name == 'push' || inputs.environment == 'staging' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy staging Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --env staging

      - name: Verify persistent staging Worker
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run smoke:deploy -- --url "$DEPLOYMENT_URL" --environment staging --object rookwood-staging --require-model

      - name: Await bounded DeepSeek evaluation
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run wait:evaluation -- --url "$DEPLOYMENT_URL"

      - name: Run bounded live reflection evaluation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REFLECTION_LIVE: "true"
          REFLECTION_DAYS: "30"
          REFLECTION_INTERVAL_DAYS: "24"
        run: npm run evaluate:reflection -- --live --days 30 --interval 24 | tee reflection-evaluation.json

      - name: Upload reflection evaluation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reflection-evaluation
          path: reflection-evaluation.json
          if-no-files-found: ignore

  deploy-production:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy production Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Verify persistent production Worker
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run smoke:deploy -- --url "$DEPLOYMENT_URL" --environment production --object rookwood
